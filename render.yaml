# Demonstration only. No real judicial data is authorized by this blueprint.
services:
  - type: web
    name: sisa-platform-demo
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sisa-demo-db
          property: connectionString
      - key: SISA_DEPLOYMENT
        value: render
      - key: SISA_DATA_MODE
        value: synthetic
      - key: SISA_SECURE_COOKIE
        value: "1"
      - key: SISA_BOOTSTRAP_KEY
        generateValue: true
      - key: SISA_DB_PATH
        value: /tmp/sisa/data/unused.db
      - key: SISA_BACKUP_DIR
        value: /tmp/sisa/backups

databases:
  - name: sisa-demo-db
    plan: basic-256mb
    region: frankfurt
    databaseName: sisa
    user: sisa
    ipAllowList: []
