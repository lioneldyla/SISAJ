name: Synthetic validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
permissions:
  contents: read
jobs:
  sqlite-browser-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt -c docs/platform_constraints.txt
      - run: python -m pytest -q tests
      - run: python -m pytest -q tests
        working-directory: cloud_aggregates
      - run: python scripts/verify_restore.py
      - run: python scripts/qualify_1500.py --report /tmp/sisa-overview-qa/qualification-1500.json
      - run: npm ci
      - name: Select available browser
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'SISA_CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
        env:
          SISA_SCREENSHOT_DIR: /tmp/sisa-overview-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overview-browser-qa
          path: /tmp/sisa-overview-qa/
          if-no-files-found: ignore
  postgresql:
    strategy:
      matrix:
        postgres: ['16', '18']
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: sisa
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: sisa_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sisa -d sisa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -c docs/platform_constraints.txt
      - run: python -m pytest -q tests/test_app.py tests/test_platform.py tests/test_legal.py tests/test_registry.py tests/test_transfer.py tests/test_dashboard.py tests/test_compliance.py tests/test_superadmin.py tests/test_followup.py tests/test_qualification.py -k 'not backup'
        env:
          SISA_TEST_POSTGRES: '1'
          DATABASE_URL: postgresql://sisa:synthetic-ci-only@127.0.0.1:55432/sisa_test
      - run: python scripts/verify_postgres_restore.py
        env:
          SISA_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          SISA_TEST_POSTGRES: '1'
          DATABASE_URL: postgresql://sisa:synthetic-ci-only@127.0.0.1:55432/sisa_test
